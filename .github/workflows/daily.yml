name: 매일 뉴스 수집

on:
  schedule:
    # UTC 23:00 = 한국시간 아침 8시 (다음날)
    - cron: "0 23 * * *"
  # Actions 탭에서 직접 눌러 실행할 수도 있습니다.
  workflow_dispatch:

# 수집 결과를 저장소에 다시 커밋하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 실행이 겹치지 않게 합니다.
concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집
        env:
          # AI 요약을 쓰려면 저장소 Secrets에 ANTHROPIC_API_KEY 를 등록하세요.
          # 등록하지 않으면 요약 없이 정상 작동합니다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect.py

      - name: 대시보드 생성
        run: python render.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          # 바뀐 게 없으면 커밋하지 않고 그냥 넘어갑니다.
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "뉴스 수집 $(date -u -d '+9 hours' '+%Y-%m-%d')"
            git push
          fi
